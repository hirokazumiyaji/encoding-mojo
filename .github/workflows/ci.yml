name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Mojo and the reference libraries
        run: pip install modular pyyaml tomli_w

      - name: Check generated compatibility cases are current
        run: |
          python3 scripts/gen_compat_cases.py
          python3 scripts/gen_yaml_compat_cases.py
          python3 scripts/gen_toml_compat_cases.py
          git diff --exit-code test/json/test_python_compat.mojo
          git diff --exit-code test/yaml/test_pyyaml_compat.mojo
          git diff --exit-code test/toml/test_tomllib_compat.mojo

      - name: Run tests
        run: ./scripts/run_tests.sh

      - name: Build packages
        run: ./scripts/build_packages.sh

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Mojo and the reference libraries
        run: pip install modular pyyaml tomli_w

      - name: Benchmark json against CPython
        run: |
          python3 bench/json/gen_data.py
          echo "== json-mojo"
          mojo run -I src bench/json/bench_json.mojo
          echo "== CPython"
          python3 bench/json/bench_python.py

      - name: Benchmark yaml against PyYAML
        run: |
          python3 bench/yaml/gen_data.py
          echo "== yaml-mojo"
          mojo run -I src bench/yaml/bench_yaml.mojo
          echo "== PyYAML"
          python3 bench/yaml/bench_python.py

      - name: Benchmark toml against tomllib
        run: |
          python3 bench/toml/gen_data.py
          echo "== toml-mojo"
          mojo run -I src bench/toml/bench_toml.mojo
          echo "== CPython"
          python3 bench/toml/bench_python.py
